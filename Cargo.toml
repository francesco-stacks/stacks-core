[workspace]
resolver = "2"
members = [
    "stackslib",
    "stacks-common",
    "pox-locking",
    "clarity-types",
    "clarity",
    "stx-genesis",
    "libstackerdb",
    "libsigner",
    "stacks-signer",
    "stacks-node",
    "stacks-bench",
    "contrib/stacks-inspect",
    "contrib/stacks-cli"
]

exclude = ["contrib/tools/config-docs-generator"]

# Dependencies we want to keep the same between workspace members
[workspace.dependencies]
ed25519-dalek = { version = "2.1.1", default-features = false }
hashbrown = { version = "0.15.2", features = ["serde"] }
lazy_static = "1.4.0"
rand_core = "0.6.4"
rand = "0.8"
rand_chacha = "0.3.1"
serde = "1"
serde_derive = "1"
serde_json = { version = "1.0", features = ["arbitrary_precision", "unbounded_depth"] }
slog = { version = "2.5.2", features = [ "max_level_trace" ] }
rusqlite = { version = "0.31.0", features = ["blob", "serde_json", "i128_blob", "bundled", "trace"] }
tikv-jemallocator = "0.5.4"
thiserror = "1.0.65"
toml = "0.5.6"
clap = { version = "4.5.51", default-features = false, features = ["std", "derive", "color", "help", "usage", "error-context", "suggestions"] }
anyhow = { version = "1.0.100", default-features = false }
tempfile = { version = "3.23.0", default-features = false, features = ["getrandom"] }
diesel = { version = "2.3.3", default-features = false, features = ["sqlite", "returning_clauses_for_sqlite_3_35", "chrono", "32-column-tables"] }
reflink-copy = { version = "0.1.28", default-features = false }
ignore = { version = "0.4.25", default-features = false }
hex = { version = "0.4.3", default-features = false, features = ["std"] }

# Use a bit more than default optimization for
# dev builds to speed up test execution
[profile.dev]
opt-level = 1

# Use release-level optimization for dependencies
# This slows down "first" builds on development environments,
# but won't impact subsequent builds.
[profile.dev.package."*"]
opt-level = 3

[profile.release]
debug = true
codegen-units = 1
lto = "fat"

# Release build with less LTO
# Useful for faster builds or low-RAM environments
[profile.release-lite]
inherits = "release"
lto = "thin"

# faster tests for `insta` https://docs.rs/insta/1.43.2/insta/#optional-faster-runs
[profile.dev.package]
insta.opt-level = 3
similar.opt-level = 3
