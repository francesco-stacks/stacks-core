[package]
name = "stacks-bench"
version = "0.0.1"
license = "GPLv3"
homepage = "https://github.com/blockstack/stacks-blockchain"
repository = "https://github.com/blockstack/stacks-blockchain"
description = "Stacks benchmarking tools"
keywords = [ "stacks", "stx", "bitcoin", "crypto", "blockstack", "decentralized", "dapps", "blockchain" ]
edition = "2024"

[lib]
name = "stacks_bench"
path = "src/lib.rs"

[[bin]]
name = "stacks-bench"
path = "src/main.rs"

[dependencies]
clarity = { path = "../clarity", features = ["rusqlite", "testing"] }
stackslib = { path = "../stackslib", features = ["testing"] }
stacks-common = { path = "../stacks-common", features = ["testing"] }
stx_genesis = { path = "../stx-genesis", package = "stx-genesis" }

anyhow.workspace = true
clap.workspace = true
tempfile.workspace = true
diesel.workspace = true
reflink-copy.workspace = true
ignore.workspace = true
hex.workspace = true
