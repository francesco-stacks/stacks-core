<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Stacks Bench Profiler Explorer</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div class="title">
        <h1>Stacks Bench Profiler Explorer</h1>
        <p>Lightweight tree view for profiler traces.</p>
      </div>
    </header>

    <section class="controls">
      <div class="control-group">
        <label for="runSelect">Benchmark Run</label>
        <select id="runSelect"></select>
      </div>

      <div class="control-group">
        <label>Mode</label>
        <div class="mode-toggle">
          <label><input type="radio" name="mode" value="tx" checked /> Transaction Trace</label>
          <label><input type="radio" name="mode" value="run" /> Run Scope</label>
        </div>
      </div>

      <div class="control-group" id="txSelectGroup">
        <label for="txSelect">Stacks Tx</label>
        <input type="text" id="txSearch" placeholder="Filter by tx hash prefix" />
        <select id="txSelect"></select>
      </div>

      <div class="control-group" id="blockSelectGroup">
        <label for="blockSelect">Stacks Block</label>
        <select id="blockSelect">
          <option value="">Any</option>
        </select>
      </div>

      <div class="control-group">
        <label for="minWall">Min Wall (ms)</label>
        <input type="number" id="minWall" placeholder="0" />
      </div>

      <div class="control-group">
        <label for="segmentRoot">Segment Root ID</label>
        <input type="number" id="segmentRoot" placeholder="root record id" />
      </div>

      <div class="control-group">
        <label for="limit">Limit</label>
        <input type="number" id="limit" value="5000" min="100" step="100" />
      </div>

      <div class="control-group column-chooser">
        <label>Columns</label>
        <div class="dropdown">
          <button id="columnToggle" class="dropdown-toggle" type="button">Columns</button>
          <div id="columnMenu" class="dropdown-menu"></div>
        </div>
      </div>

      <div class="control-group">
        <button id="loadTrace">Load Trace</button>
      </div>
    </section>

    <section class="summary">
      <div id="summary"></div>
    </section>

    <section class="tree">
      <div id="treeContainer"></div>
    </section>

    <script src="/app.js"></script>
  </body>
</html>
